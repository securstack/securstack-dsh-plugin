<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">SecurStack DeepSeek Harness Plugin</title>
  <desc id="desc">Clean SecurStack banner for DeepSeek Harness with SAST, SCA, DAST, secrets, IaC, policy, scan, and doctor coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071116"/>
      <stop offset="0.55" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#0e1715"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d8ff"/>
      <stop offset="1" stop-color="#1aa7ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cff9b"/>
      <stop offset="1" stop-color="#15c778"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1030" cy="96" r="230" fill="#1aa7ff" opacity="0.10"/>
  <circle cx="870" cy="500" r="250" fill="#15c778" opacity="0.10"/>
  <path d="M0 430C165 390 330 406 500 454C690 508 850 504 1035 452C1140 422 1228 420 1280 436V640H0Z" fill="#0b241f" opacity="0.42"/>
  <g opacity="0.32" stroke="#183241" stroke-width="1">
    <path d="M0 360H1280M0 396H1280M0 432H1280M0 468H1280M0 504H1280M0 540H1280M0 576H1280"/>
    <path d="M36 340V640M72 340V640M108 340V640M144 340V640M180 340V640M216 340V640M252 340V640M288 340V640M324 340V640M360 340V640M396 340V640M432 340V640M468 340V640M504 340V640M540 340V640M576 340V640M612 340V640M648 340V640M684 340V640M720 340V640M756 340V640M792 340V640M828 340V640M864 340V640M900 340V640M936 340V640M972 340V640M1008 340V640M1044 340V640M1080 340V640M1116 340V640M1152 340V640M1188 340V640M1224 340V640M1260 340V640"/>
  </g>

  <g transform="translate(70 118)">
    <text x="0" y="72" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">SecurStack</text>
    <text x="2" y="130" fill="#dce8ef" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500">DeepSeek Harness Plugin</text>
    <rect x="2" y="168" width="430" height="2" fill="url(#cyan)" opacity="0.78"/>
    <text x="2" y="226" fill="#b7cbd6" font-family="Arial, Helvetica, sans-serif" font-size="21">AI-agent security tools powered by the SecurStack CLI</text>
  </g>

  <g transform="translate(70 395)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <g><circle cx="10" cy="10" r="7" fill="#7cff9b"/><text x="30" y="17" fill="#cfe1e8">SAST code analysis</text></g>
    <g transform="translate(0 42)"><circle cx="10" cy="10" r="7" fill="#35d8ff"/><text x="30" y="17" fill="#cfe1e8">SCA dependency checks</text></g>
    <g transform="translate(0 84)"><circle cx="10" cy="10" r="7" fill="#ffd166"/><text x="30" y="17" fill="#cfe1e8">Secrets, IaC, DAST and policy gates</text></g>
  </g>

  <g transform="translate(620 116)" filter="url(#shadow)">
    <rect width="560" height="365" rx="22" fill="#101e28" stroke="#2b90b8" stroke-width="2"/>
    <rect width="560" height="50" rx="22" fill="#162b39"/>
    <circle cx="30" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="55" cy="26" r="7" fill="#ffbd2e"/>
    <circle cx="80" cy="26" r="7" fill="#28c840"/>
    <text x="42" y="112" fill="#59ff94" font-family="Courier New, monospace" font-size="30" font-weight="700">&gt; securstack scan</text>
    <text x="42" y="158" fill="#8fb0bf" font-family="Courier New, monospace" font-size="21">{ "format": "json" }</text>

    <g transform="translate(42 205)">
      <rect width="142" height="50" rx="12" fill="#102019" stroke="#2eea88" stroke-width="2"/>
      <text x="71" y="32" text-anchor="middle" fill="#dffeed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">SCAN</text>
      <rect x="166" width="142" height="50" rx="12" fill="#102019" stroke="#2eea88" stroke-width="2"/>
      <text x="237" y="32" text-anchor="middle" fill="#dffeed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">POLICY</text>
      <rect x="332" width="142" height="50" rx="12" fill="#102019" stroke="#2eea88" stroke-width="2"/>
      <text x="403" y="32" text-anchor="middle" fill="#dffeed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">DOCTOR</text>
    </g>

    <g transform="translate(362 70)">
      <path d="M82 0l66 26v66c0 61-39 103-66 116C55 195 16 153 16 92V26L82 0Z" fill="#102a25" stroke="url(#green)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M51 94l23 23 49-58" fill="none" stroke="#7cff9b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(42 290)">
      <rect width="474" height="42" rx="21" fill="#122f3c"/>
      <rect width="330" height="42" rx="21" fill="url(#cyan)"/>
      <text x="22" y="28" fill="#081116" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">safe non-destructive Harness tools</text>
    </g>
  </g>
